name: Bug report
description: Something isn't working the way you expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you see instead?
      placeholder: |
        Steps:
        1. Opened http://localhost:3000/ledger
        2. Clicked "Export CSV"
        Expected: CSV with all bills
        Got: 404 in network tab
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node/Bun version, browser, and the dashboard route where the issue occurs.
      placeholder: |
        - macOS 14.4 / Ubuntu 22.04 / Windows 11
        - Bun 1.1.28 / Node 20.11.0
        - Browser: Chrome 125 / Firefox 126 / Safari 17.5
        - Route: /ledger
    validations:
      required: true

  - type: textarea
    id: browser-console
    attributes:
      label: Browser console
      description: Open DevTools → Console tab. Copy any errors or warnings. Scrub any JWTs or personal data.
      render: text
    validations:
      required: false

  - type: textarea
    id: network-tab
    attributes:
      label: Network tab / HAR (if relevant)
      description: If the bug involves a failed API call, include the request URL, status code, and response body (redacted). A HAR export is even better.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have scrubbed any PII (connection IDs, JWTs, phone numbers) from my logs.
          required: true
